name: XPRouter
options:
  bundleIdPrefix: com.scottsthoughts
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "6.3"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "B2PMQASX62"
targets:
  XPRouter:
    type: application
    platform: iOS
    sources:
      - path: XPRouter
        excludes:
          - "Resources/Art"
      - path: XPRouter/Resources/Art
        type: folder
        buildPhase: resources
    dependencies:
      - framework: build/XPRCore.xcframework
        embed: false
      - sdk: libc++.tbd
      - sdk: libz.tbd
      - sdk: SystemConfiguration.framework
      - sdk: Security.framework
    preBuildScripts:
      - name: Build Rust core
        script: |
          "${PROJECT_DIR}/scripts/build_rust.sh"
          "${PROJECT_DIR}/scripts/prepare_assets.sh"
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scottsthoughts.xprouter
        PRODUCT_NAME: XP Router
        INFOPLIST_FILE: XPRouter/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        OTHER_LDFLAGS: -lc++
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CODE_SIGN_STYLE: Automatic
  XPRouterUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [XPRouterUITests]
    dependencies:
      - target: XPRouter
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: XPRouter
schemes:
  XPRouter:
    build:
      targets:
        XPRouter: all
        XPRouterUITests: [test]
    test:
      targets: [XPRouterUITests]
