[package]
name = "xpr-app"
version.workspace = true
edition.workspace = true
default-run = "xpr-app"

[[bin]]
name = "xpr-app"
path = "src/main.rs"

[[bin]]
name = "replay_to_route"
path = "src/bin/replay_to_route.rs"

[dependencies]
xpr-core = { path = "../xpr-core" }
xpr-data = { path = "../xpr-data", features = ["embed-data"] }
xpr-engine = { path = "../xpr-engine" }
xpr-calc = { path = "../xpr-calc" }
xpr-map = { path = "../xpr-map", features = ["embed-map-data"] }
xpr-recorder = { path = "../xpr-recorder" }
xpr-replay = { path = "../xpr-replay" }
xpr-update = { path = "../xpr-update" }
xpr-ui-kit = { path = "../xpr-ui-kit" }
egui = { version = "0.37.0", features = ["default_fonts", "monochrome_emoji_fonts"] }
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "clipboard", "links", "x11", "wayland"] }
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = { version = "0.17", default-features = false, features = ["gtk3"] }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
chrono = { workspace = true }
zip = { version = "9", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_System_Memory", "Win32_System_Threading"] }

[dev-dependencies]
sha2 = "0.11"

[build-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "ico"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

