[package]
name = "xpr-app"
version.workspace = true
edition.workspace = true
default-run = "xpr-app"

[[bin]]
name = "xpr-app"
path = "src/main.rs"

[[bin]]
name = "replay_to_route"
path = "src/bin/replay_to_route.rs"

[dependencies]
xpr-core = { path = "../xpr-core" }
xpr-data = { path = "../xpr-data", features = ["embed-data"] }
xpr-engine = { path = "../xpr-engine" }
xpr-calc = { path = "../xpr-calc" }
xpr-map = { path = "../xpr-map", features = ["embed-map-data"] }
xpr-recorder = { path = "../xpr-recorder" }
xpr-replay = { path = "../xpr-replay" }
xpr-update = { path = "../xpr-update" }
xpr-ui-kit = { path = "../xpr-ui-kit" }
xpr-dex = { path = "../xpr-dex", features = ["embed-dex-data"] }
# the Dex page (every tab: its default features)
xpr-dex-ui = { path = "../xpr-dex-ui" }
egui = "0.33.3"
eframe = { version = "0.33.3", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = { version = "0.15", default-features = false, features = ["gtk3"] }
serde = { workspace = true }
serde_json = { workspace = true }
indexmap = { workspace = true }
log = { workspace = true }
chrono = { workspace = true }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_System_Memory", "Win32_System_Threading"] }

[build-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "ico"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

