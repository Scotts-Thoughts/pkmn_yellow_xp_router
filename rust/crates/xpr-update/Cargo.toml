[package]
name = "xpr-update"
version.workspace = true
edition.workspace = true

[dependencies]
xpr-core = { path = "../xpr-core" }
serde_json = { workspace = true }
log = { workspace = true }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls", "http2", "system-proxy"] }
sha2 = "0.11"
zip = { version = "9", default-features = false, features = ["deflate"] }
