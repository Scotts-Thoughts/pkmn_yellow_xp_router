[workspace]
resolver = "2"
members = [
    "crates/xpr-core",
    "crates/xpr-data",
    "crates/xpr-engine",
    "crates/xpr-calc",
    "crates/xpr-recorder",
    "crates/xpr-update",
    "crates/xpr-golden",
    "crates/xpr-ui-kit",
    "crates/xpr-app",
]

[workspace.package]
version = "6.0.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = { version = "2", features = ["serde"] }
thiserror = "2"
log = { version = "0.4", features = ["std"] }
once_cell = "1"
chrono = "0.4"
encoding_rs = "0.8"
rayon = "1"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
opt-level = 3

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
